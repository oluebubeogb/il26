services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibeku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibeku_secure_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ibeku_league}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibeku} -d ${POSTGRES_DB:-ibeku_league}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ibeku}:${POSTGRES_PASSWORD:-ibeku_secure_change_me}@db:5432/${POSTGRES_DB:-ibeku_league}?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      PRIMARY_ADMIN_USERNAME: ${PRIMARY_ADMIN_USERNAME:-}
      PRIMARY_ADMIN_PASSWORD: ${PRIMARY_ADMIN_PASSWORD:-}
      PRIMARY_ADMIN_PHONE: ${PRIMARY_ADMIN_PHONE:-}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
